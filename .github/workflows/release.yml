# ═══════════════════════════════════════════════════════════════════
# WB Bridge — 发布自动打包工作流
# ───────────────────────────────────────────────────────────────────
# 触发：推送 v* 标签（如 v1.0.1）或手动 workflow_dispatch
#   • 手动触发（workflow_dispatch）：默认【仅测试构建】——只上传 Actions
#     Artifact 不创建 Release，可下载安装包在本地测试；
#     勾选 create_release 后才创建 Draft Release（与推 tag 行为一致）
# 产物：
#   • Windows:  NSIS 安装包(.exe) + MSI 安装包(.msi)
#   • macOS:   .dmg + .app（ad-hoc 签名）
#   • Linux:   .AppImage + .deb
# 说明：
#   • 核心已用 Rust 重写并**静态编进 Tauri 壳**（`src-tauri/core/` 作为 path 依赖），
#     不再需要 Node 运行时、不再有 pkg sidecar 打包步骤，也不再有 `src-tauri/binaries/`；
#     因此构建 = cargo 编译壳（含核心）+ Vite 打包面板，Node 只用于前端构建。
#   • macOS 产物为 ad-hoc 签名（无 Developer ID 证书），首次打开需在
#     系统设置中放行。
#   • Windows 产物未签名，SmartScreen 会提示"更多信息 → 仍要运行"。
#   • 所有产物先上传为 Actions Artifact，再汇总到 Draft Release，
#     人工确认后点"Publish release"正式发布。
#   • test 作业里有一道「触发标签 ↔ src-tauri/tauri.conf.json 版本」闸门：标签名与源码版本
#     不一致时直接失败。v1.0.1 曾把标签打在不含版本推进的提交上，于是安静地产出了
#     WB Bridge_1.0.0_* 且功能落后 4 个提交的安装包；check-version.mjs 只校验同一提交内
#     各处落点互相一致，抓不到这类错，所以必须单独设闸。
#   • 发布顺序铁律：先 `npm run version:set -- <x.y.z>` 并提交，**再**在那一个提交上打标签。
# 自动更新（v1.0.2 起接线）：
#   • bundle.createUpdaterArtifacts=true → 每个平台额外产出更新包与 .sig：
#       macOS tauri 实测产出「WB Bridge.app.tar.gz(.sig)」——**既不带版本也不带架构**，
#            两个 mac runner 会往同一 Release 传同名资产、后者静默覆盖前者，
#            所以本工作流在上传前把它改名为「WB Bridge_<arch>.app.tar.gz(.sig)」
#            （minisign 签的是内容不是文件名，改名不影响验签）。
#       Windows *-setup.exe(.sig)（MSI 不参与更新）
#       Linux   ✅ 2026-10-03 v1.0.2 首跑实测：updater 包就是裸 *.AppImage(.sig)，
#               bundler **没有**额外打一层 *.AppImage.tar.gz；*.deb 也带 .sig 但不参与更新。
#               （生成脚本对两种形态都接受，同时带签名时取 .tar.gz 并告警。）
#   • 🔴 资产名的空格会被 GitHub 规范化成 `.`（v1.0.2 实测：磁盘 `WB Bridge_…` → API `WB.Bridge_…`），
#       而 `/releases/download/<tag>/<空格名>`（含 %20）一律 404。所以 gen-latest-json.mjs 先
#       `name.replace(/ /g, '.')` 再编码，本作业紧接着用 API 把六条 url 末段与实际资产名逐条对账——
#       那一轮六平台资产齐全、六条 .sig 也都与配置公钥配对，唯独清单每条都下载不了，
#       而这类错误只有客户端在下载那一步才暴露，闸门必须放在发布前。
#   • 签名链路（2026-10-03 完全对齐参考项目 fastenerTradeWorkbench / lockPass）：
#       构建一律走 `npm run tauri:build` = `node scripts/with-updater-key.mjs tauri build`。
#       包装器**只做注入、不做前置校验**（不判形态、不试签、不因配对不符挡住构建）：
#       按「进程环境 → 仓库 .env.local / .env → ~/.tauri/wbBridge.env、~/.tauri/wbBridge-updater.env
#       → 兜底 ~/.tauri/wbBridge-updater.key」汇齐私钥与口令，把路径形式读成内联全文
#       （`tauri build` 只认 TAURI_SIGNING_PRIVATE_KEY；内联与 TAURI_SIGNING_PRIVATE_KEY_PATH 互斥，
#       注入后删掉后者），明文私钥则**显式**置空口令（否则无 TTY 时 CLI 会交互式询问并以
#       「Device not configured (os error 6)」失败）。私钥与口令全程不打印，只输出来源文件名与公开的 key ID。
#   • 私钥走 GitHub **Repository Variables**（不是 Secrets）：vars.TAURI_SIGNING_PRIVATE_KEY
#     （**内联私钥全文**）与 vars.TAURI_SIGNING_PRIVATE_KEY_PASSWORD；公钥内嵌
#     src-tauri/tauri.conf.json 的 plugins.updater.pubkey。
#     ⚠ 2026-10-03 按用户决定对齐参考项目改用 Variables，代价如实记录在这里：Variables 是
#       **明文可见**的（Settings → Environments/Variables 页面直接显示值，日志里也**不会**像
#       Secrets 那样被自动打码）。因此本工作流**绝不得**把这两个变量 echo / 打印 /
#       写进 $GITHUB_STEP_SUMMARY。私钥仍绝不入库。想换回 Secrets 只需把下面的 vars. 改回
#       secrets.，包装器与命令都不用动。
#     ⚠ 口令必须真的填进变量：当前这把钥（~/.tauri/wbBridge-updater.key，2026-09-30 生成）
#       **带口令**，口令留空即「Wrong password for that key」。
#     ⚠ 变量取到**空值**时 tauri 报「failed to decode secret key: incorrect updater private key
#       password: Missing comment in secret key」——这句看着像口令错，实际是空值（本机 14 组形态复现
#       钉死了这个映射），而且它要等整套 Rust 编译跑完、在打包那一步才炸。
#       ⚠ 2026-10-03 用户决定：**不在 CI 里设私钥前置校验步骤**（私钥与口令是否在位由维护者自行确认）。
#       未配置该变量时 createUpdaterArtifacts 会让构建直接失败，而不是静默产出一批没有 .sig 的更新包。
#   • pubkey 里只有**一条**公钥，且必须是签这批 .sig 的那把（当前 key ID 2B11F78BEA8A43F）：
#       2026-10-03 实读 tauri-plugin-updater 2.13 与 minisign-verify 0.2.5 的源码，纠正了此前写进文档的
#       错误结论——客户端 verify_signature 走**单个** PublicKey::decode，它只读解码文本的前两行，
#       所以「把两把公钥拼进同一个 pubkey」**不等于**轮换白名单，只有第一条生效。此前提交在配置里的
#       **只有** 126D4E208E0F17BA 一条（属已丢失的 20261001 那把钥），而签名用的是 2B11F78BEA8A43F，
#       于是 `tauri build` 打「The updater secret key from TAURI_SIGNING_PRIVATE_KEY does not match the
#       public key from plugins > updater > pubkey」，且这样签出的 .sig 客户端必判无效。
#       修复 = 把 pubkey 换成真正签名那把的公钥（已完成）。**换钥必须同步换 pubkey**，
#       且已发布的老客户端只认它自己内嵌的那条——所以换钥只能配一次「老版本还能收到最后一次更新」的发布。
#       ✅ 本次替换不影响任何已发布版本：v1.0.0 / v1.0.1 两个标签都**早于 updater 接线**
#         （v1.0.1 的 tauri.conf.json 无 plugins.updater、Cargo.toml 无 tauri-plugin-updater、
#          无 createUpdaterArtifacts），126D4E208E0F17BA 从未进入交付给用户的二进制。
#   • macOS 的 .dmg 由 scripts/make-dmg.sh 用 **hdiutil** 生成（`npm run make:dmg`；CI 里给它
#     TARGET_TRIPLE 以选中对应 target 目录下的 bundle）：Tauri 自带的 create-dmg 末尾要用 AppleScript
#     美化窗口，在无 GUI / 无 Finder 自动化授权的 CI 上会失败，所以 bundle.targets 已不含 dmg，
#     改为显式列表 ["app","nsis","msi","appimage","deb"]（本平台不适用的目标由打包器跳过）。
#   • 构建时那条「Warn skipping app notarization, no APPLE_ID & APPLE_PASSWORD & APPLE_TEAM_ID
#     or APPLE_API_KEY & APPLE_API_ISSUER & APPLE_API_KEY_PATH environment variables found」
#     属**预期、无需修**：本项目是 ad-hoc 签名（tauri.conf.json 的 bundle.macOS.signingIdentity "-"）、
#     没有 Developer ID 证书也没有公证凭据，两个参考项目同样带着这条警告出货。
#   • latest.json 由末尾的 update-manifest 作业**单点**生成（scripts/gen-latest-json.mjs）：
#     三个 build 作业只跑 `tauri build` 产出 bundle 与 .sig，谁都不写清单，
#     不会出现「6 个并发写者互相覆盖、静默漏平台」。
#   • Release 现在由 softprops/action-gh-release 创建（2026-10-03 起不再用 tauri-action）：
#     各作业的 tag_name / release_name 都由「读取版本号」步骤现读 src-tauri/tauri.conf.json 拼成
#     v<版本>，所以 workflow_dispatch 勾选 create_release 时也不会把分支名当标签开出第二个 Release。
#   • Draft 未 Publish 前 releases/latest/download/latest.json 返回 404 属预期：
#     更新通道只在人工点完「Publish release」之后生效。
#   • ✅ 本工作流自「移除 Node 核心」改造后**已跑通完整一轮**（2026-10-03，tag v1.0.2，run 37092915120，
#     8/8 作业全绿，Release 已发布 23 个资产）：六平台产物、mac 补架构后缀、hdiutil dmg、
#     update-manifest 与产物版本自检都按本文件描述执行。此前同日的首跑止步于 updater 签名步骤
#     （私钥变量取到空值），已由改用仓库级 Variables + `npm run tauri:build` 注入器解决。
#     ✅ 同日本机等价跑通也成立：`tauri:build -- --bundles app` 退出 0 产出
#     `WB Bridge.app.tar.gz`(3,596,811 B) + `.sig`(428 B，签名者 key ID 逐字节解出 = 2B11F78BEA8A43F =
#     配置 pubkey 那条)，`make:dmg` 产出 `WB Bridge_1.0.2_aarch64.dmg`（只读挂载含 app + Applications，
#     codesign --verify --deep --strict 通过）。
#   • ❌ 仍**未验证**：一次真实升级闭环（客户端拉到包、装完 relaunch() 起来）——属必须实机点一遍的类别。
# ═══════════════════════════════════════════════════════════════════

name: Release Build (Tauri)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      create_release:
        description: '构建后创建 Draft Release（不勾选则仅上传 Artifact 供测试）'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # ── 核心测试（Rust：187 单测 + 11 组 JS↔Rust 对拍快照 + 9 条红线）────
  test:
    name: 核心测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js 24
        # 与根 package.json 的 engines.node >= 24 对齐（此前是 22，低于本仓声明的下限）。
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 启用 cargo 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri/core

      - name: 运行核心测试
        # 对拍测试比较的是 tests/fixtures/*.json 里冻结的 JS 真相快照，无需 Node。
        run: cargo test --manifest-path src-tauri/core/Cargo.toml

      - name: 校验版本号一致性
        # package.json / tauri.conf.json / Cargo.toml / AGENTS.md 必须同一版本。
        run: node scripts/check-version.mjs

      - name: 运行面板偏好、更新清单与签名注入单测
        # 三组都是 node --test、只用 node 内置模块（不引测试框架、不需要 npm ci，也不碰真实私钥）：
        #   • src/core/prefs.test.js —— 凭据字段进不了 localStorage、坏数据回落默认值；
        #   • scripts/gen-latest-json.test.mjs —— latest.json 唯一写者的缺平台/缺签名/
        #     mac 漏架构后缀/歧义产物四类失败路径（这些错误 otherwise 只有用户装上才暴露）。
        #   • scripts/with-updater-key.test.mjs —— `npm run tauri:build` 的签名注入器（取值优先级、
        #     路径读成内联全文并删掉互斥的 _PATH、明文钥显式置空口令、只告警的首条公钥配对、
        #     命令拼装契约），并断言接线：package.json 的 tauri:build 确实经本脚本、本工作流把私钥读成
        #     vars.（而非取不到值的环境 Secret）且确实调用 npm run tauri:build、配置里只有一条生效公钥。
        #     ⚠ 只测纯函数与接线，不读 ~/.tauri、不试签、不执行构建。
        run: |
          node --test src/core/prefs.test.js
          node --test scripts/gen-latest-json.test.mjs
          node --test scripts/with-updater-key.test.mjs

      - name: 校验触发标签与源码版本一致
        # 上一项只比对「同一提交内 5 处落点互相一致」，因此标签指向一份全体为旧版本的
        # 提交时它照样通过 —— v1.0.1 就是这样产出了 WB Bridge_1.0.0_aarch64.dmg，而且那个
        # 安装包不含最近 4 个提交。这里补上唯一能抓住该错误的闸门。
        # 版本还决定各作业上传 Release 时用的标签名（v<conf 版本>），不一致就会开出两个 Release。
        # workflow_dispatch 时 GITHUB_REF_NAME 是分支名，不参与比较，故只在推标签时运行。
        if: github.event_name == 'push'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          conf="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          echo "触发标签 = ${GITHUB_REF_NAME}，src-tauri/tauri.conf.json 版本 = ${conf}"
          if [ "${tag}" != "${conf}" ]; then
            echo "::error::标签 ${GITHUB_REF_NAME} 与源码版本 ${conf} 不一致：产物会被命名为 ${conf}，且该标签提交很可能不含本次版本推进。请先提交版本推进，再在那一个提交上重新打标签。"
            exit 1
          fi
          echo "标签与源码版本一致，可继续构建。"

  # ── macOS：.app（tauri）+ .dmg（hdiutil，ad-hoc 签名）──────────────
  build-macos:
    name: macOS (${{ matrix.arch }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: aarch64-apple-darwin
          - os: macos-15
            arch: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js 24
        # 与根 package.json 的 engines.node >= 24 对齐（此前是 22，低于本仓声明的下限）。
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}

      - name: 启用 cargo 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci

      - name: 构建 Tauri 应用
        # 走 npm run tauri:build（= `node scripts/with-updater-key.mjs tauri build`），由包装器把私钥
        # 归一成 tauri build 只认的内联 TAURI_SIGNING_PRIVATE_KEY。--bundles app 是因为 .dmg 改由
        # 下一步的 hdiutil 生成（Tauri 的 create-dmg 走 AppleScript，无 GUI 的 runner 上会失败）。
        # CI 里私钥与口令由 Repository Variables 透传；没配或取到空值时 createUpdaterArtifacts
        # 会让构建在那一步失败，而不是静默产出一批没有 .sig 的更新包。
        # ⚠ 变量是明文值、日志不打码，所以这里只透传，绝不 echo。
        run: npm run tauri:build -- --target ${{ matrix.arch }} --bundles app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ vars.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ vars.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: 生成 .dmg（hdiutil，CI 可用）
        # 产物 src-tauri/target/<triple>/release/bundle/dmg/WB Bridge_<version>_<arch>.dmg。
        # TARGET_TRIPLE 必须传：交叉目标时 uname -m 反映的是 runner 架构，会拿错 bundle 目录、
        # 并把 x86_64 的包标成 aarch64。
        run: npm run make:dmg
        env:
          TARGET_TRIPLE: ${{ matrix.arch }}

      - name: 给 macOS 更新包补架构后缀
        # 实测：tauri 产出的 updater 包叫「WB Bridge.app.tar.gz」，既不带版本也不带架构，
        # 于是两个 mac runner 会往同一个 Release 传**同名**资产、后者静默覆盖前者，
        # latest.json 也无法靠文件名区分 darwin-aarch64 / darwin-x86_64。
        # 统一补成「WB Bridge_<arch>.app.tar.gz」；.sig 同步改名——minisign 签的是内容不是文件名，
        # 因此改名不影响 updater 验签。
        run: |
          set -euo pipefail
          arch="${{ matrix.arch }}"
          arch="${arch%%-*}"
          renamed=0
          for bundle_dir in "src-tauri/target/${arch}-apple-darwin/release/bundle/macos" src-tauri/target/release/bundle/macos; do
            [ -d "${bundle_dir}" ] || continue
            for pkg in "${bundle_dir}"/*.app.tar.gz; do
              [ -e "${pkg}" ] || continue
              case "$(basename "${pkg}")" in *"_${arch}.app.tar.gz") continue ;; esac
              target="${pkg%.app.tar.gz}_${arch}.app.tar.gz"
              mv "${pkg}" "${target}"
              if [ -f "${pkg}.sig" ]; then
                mv "${pkg}.sig" "${target}.sig"
              else
                echo "::warning::${pkg} 没有配对 .sig，该平台产物不会进入更新清单"
              fi
              echo "重命名：$(basename "${pkg}") → $(basename "${target}")"
              renamed=$((renamed + 1))
            done
          done
          echo "本次补架构后缀（arch=${arch}）的 updater 包：${renamed} 个。"

      - name: 读取版本号（Release 标签名）
        # softprops 默认把触发引用当标签名：workflow_dispatch 时那是**分支名**，会凭空建出一个
        # 名为 dev 的标签与 Release。这里现读配置版本拼出 v<版本>，推 tag 时与已有标签同名、无副作用。
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - name: 打印产物名（上传前留痕，供人工核对资产名 = tag 版本）
        # find 用 BSD/GNU 都支持的写法（macOS runner 上没有 GNU find 的 -printf）。
        shell: bash
        run: |
          conf="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          echo "源码版本 = ${conf}，触发引用 = ${GITHUB_REF_NAME}"
          find src-tauri/target -path '*/release/bundle/*' -type f \
            \( -name '*.dmg' -o -name '*.app' -o -name '*.app.tar.gz' -o -name '*.sig' \) -print | sort

      - name: 上传产物到 Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-bundles
          if-no-files-found: warn
          path: |
            src-tauri/target/${{ matrix.arch }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.arch }}/release/bundle/**/*.app.tar.gz
            src-tauri/target/${{ matrix.arch }}/release/bundle/**/*.sig
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.app.tar.gz
            src-tauri/target/release/bundle/**/*.sig

      - name: 上传到 GitHub Release（仅推 tag 或勾选 create_release 时）
        if: github.event_name == 'push' || inputs.create_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          release_name: WB Bridge v${{ steps.ver.outputs.version }}
          body: WB Bridge — 让 WorkBuddy 使用 OpenCode 免费模型。
          draft: true
          prerelease: false
          generate_release_notes: true
          # 更新包与 .sig 必须进 Release：latest.json 里的 url 指的就是这些资产。
          files: |
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.app.tar.gz
            src-tauri/target/**/release/bundle/**/*.sig

  # ── Windows：NSIS + MSI ──────────────────────────────────────────
  build-windows:
    name: Windows (${{ matrix.arch }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            arch: x86_64-pc-windows-msvc
          - os: windows-11-arm
            arch: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js 24
        # 与根 package.json 的 engines.node >= 24 对齐（此前是 22，低于本仓声明的下限）。
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}

      - name: 启用 cargo 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci

      - name: 构建 Tauri 应用
        # 走 npm run tauri:build（= `node scripts/with-updater-key.mjs tauri build`），由包装器把私钥
        # 归一成 tauri build 只认的内联 TAURI_SIGNING_PRIVATE_KEY；口令缺失时包装器只告警，
        # 真正的失败仍由打包器给出。
        # bundle.targets 里的 app/dmg/appimage/deb 在本平台不适用，由打包器自行跳过。
        # ⚠ 变量是明文值、日志不打码，所以这里只透传，绝不 echo。
        run: npm run tauri:build -- --target ${{ matrix.arch }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ vars.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ vars.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: 读取版本号（Release 标签名）
        # 与 macOS 作业同因：不让 softprops 在 workflow_dispatch 时把分支名当标签。
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - name: 打印产物名（上传前留痕，供人工核对资产名 = tag 版本）
        shell: bash
        run: |
          conf="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          echo "源码版本 = ${conf}，触发引用 = ${GITHUB_REF_NAME}"
          find src-tauri/target -path '*/release/bundle/*' -type f \
            \( -name '*.exe' -o -name '*.msi' -o -name '*.sig' \) -print | sort

      - name: 上传产物到 Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}-bundles
          if-no-files-found: warn
          path: |
            src-tauri/target/**/release/bundle/**/*.exe
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.sig

      - name: 上传到 GitHub Release（仅推 tag 或勾选 create_release 时）
        if: github.event_name == 'push' || inputs.create_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          release_name: WB Bridge v${{ steps.ver.outputs.version }}
          body: WB Bridge — 让 WorkBuddy 使用 OpenCode 免费模型。
          draft: true
          prerelease: false
          generate_release_notes: true
          # NSIS 安装包 + .sig 是更新链路的资产；MSI 只给人工安装用，不参与 updater。
          files: |
            src-tauri/target/**/release/bundle/**/*.exe
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.sig

  # ── Linux：.AppImage + .deb ──────────────────────────────────────
  build-linux:
    name: Linux (${{ matrix.arch }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            arch: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js 24
        # 与根 package.json 的 engines.node >= 24 对齐（此前是 22，低于本仓声明的下限）。
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}

      - name: 启用 cargo 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: 安装前端依赖
        run: npm ci

      - name: 构建 Tauri 应用
        # 走 npm run tauri:build（= `node scripts/with-updater-key.mjs tauri build`），由包装器把私钥
        # 归一成 tauri build 只认的内联 TAURI_SIGNING_PRIVATE_KEY。make:dmg 在本平台是空跳过，
        # 所以这里不需要额外一步。
        # ⚠ 变量是明文值、日志不打码，所以这里只透传，绝不 echo。
        run: npm run tauri:build -- --target ${{ matrix.arch }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ vars.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ vars.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: 读取版本号（Release 标签名）
        # 与 macOS 作业同因：不让 softprops 在 workflow_dispatch 时把分支名当标签。
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - name: 打印产物名（上传前留痕，供人工核对资产名 = tag 版本）
        shell: bash
        run: |
          conf="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          echo "源码版本 = ${conf}，触发引用 = ${GITHUB_REF_NAME}"
          find src-tauri/target -path '*/release/bundle/*' -type f \
            \( -name '*.AppImage' -o -name '*.AppImage.tar.gz' -o -name '*.deb' -o -name '*.sig' \) -print | sort

      - name: 上传产物到 Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}-bundles
          if-no-files-found: warn
          path: |
            src-tauri/target/**/release/bundle/**/*.AppImage
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.AppImage.tar.gz
            src-tauri/target/**/release/bundle/**/*.sig

      - name: 上传到 GitHub Release（仅推 tag 或勾选 create_release 时）
        if: github.event_name == 'push' || inputs.create_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          release_name: WB Bridge v${{ steps.ver.outputs.version }}
          body: WB Bridge — 让 WorkBuddy 使用 OpenCode 免费模型。
          draft: true
          prerelease: false
          generate_release_notes: true
          files: |
            src-tauri/target/**/release/bundle/**/*.AppImage
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.AppImage.tar.gz
            src-tauri/target/**/release/bundle/**/*.sig

  # ── 更新清单：六平台产物的唯一汇总写者 ────────────────────────────
  # 客户端 plugins.updater.endpoints 读 releases/latest/download/latest.json。
  # 放在最后一个作业 = 单一写者，不会出现「某平台静默缺席」；
  # gen-latest-json.mjs 默认要求六平台齐全，缺任何一个都退出 1 让本次发布失败。
  update-manifest:
    name: 生成更新清单 (latest.json)
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 下载六平台产物
        uses: actions/download-artifact@v4
        with:
          pattern: '*-bundles'
          path: artifacts

      - name: 生成 latest.json
        run: node scripts/gen-latest-json.mjs --dir artifacts --out latest.json

      - name: 校验清单 url 指向的资产在 Release 上真的存在
        # v1.0.2 首跑实测教训：GitHub 把 Release 资产名里的**空格规范化成 `.`**（磁盘上的
        # `WB Bridge_…` 在 API 里是 `WB.Bridge_…`），而按本地文件名 `%20` 拼出来的 URL 一律 404。
        # 那一轮六个平台资产齐全、六条 `.sig` 也都与配置里的公钥配对，清单却**每一条都下载不了**——
        # 而且只有客户端在下载那一步才会发现。所以发布前用 API 把每条 url 的末段与实际资产名逐一对账。
        # Draft 阶段带 GITHUB_TOKEN 查询可见（未认证访问看不到 Draft）。
        if: github.event_name == 'push' || inputs.create_release == true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          export CONF_VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          node --input-type=module -e '
            const tag = `v${process.env.CONF_VERSION}`;
            const manifest = JSON.parse(await (await import("node:fs/promises")).readFile("latest.json", "utf8"));
            const headers = { accept: "application/vnd.github+json", authorization: `Bearer ${process.env.GITHUB_TOKEN}` };
            const list = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/releases?per_page=100`, { headers });
            if (!list.ok) { console.error(`::error::列 Release 失败 HTTP ${list.status}`); process.exit(1); }
            const release = (await list.json()).find((r) => r.tag_name === tag);
            if (!release) { console.error(`::error::找不到标签 ${tag} 的 Release，资产名无从对照（Release 由 build 作业创建，须在它们之后运行）`); process.exit(1); }
            const names = new Set(release.assets.map((a) => a.name));
            let bad = 0;
            for (const [key, entry] of Object.entries(manifest.platforms)) {
              const seg = decodeURIComponent(entry.url.split("/").pop());
              if (names.has(seg)) { console.log(`OK  ${key} -> ${seg}`); }
              else { bad++; console.error(`::error::${key} 的 url 末段「${seg}」不在 ${tag} 的资产名里：该平台下载必然 404`); }
            }
            console.error(`清单 ${Object.keys(manifest.platforms).length} 个平台，资产名对不上 ${bad} 个。`);
            process.exit(bad ? 1 : 0);
          '

      - name: 产物版本自检（结论写进 run summary，供 Release 正文引用）
        # 汇总六个平台实际收到的安装包，逐个核对文件名里的版本号是否等于源码版本。
        # v1.0.1 事故的二次网：标签打在不含版本推进的提交上时，test 作业的标签闸门会先红；
        # 万一闸门被绕过（手动 dispatch、改了 conf 没改标签），这里仍能把错名产物摊在明面上。
        run: |
          set -uo pipefail
          conf="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          total=0; named=0; nover=0; unexpected=0
          while IFS= read -r f; do
            [ -n "${f}" ] || continue
            base="$(basename "${f}")"
            total=$((total + 1))
            if [[ "${base}" == *"${conf}"* ]]; then
              named=$((named + 1))
              echo "· ${base}"
            elif [[ "${base}" == *".app.tar.gz" ]]; then
              nover=$((nover + 1))
              echo "· ${base}（macOS 更新包名按设计不含版本）"
            elif [[ "${base}" == *".dmg" ]]; then
              unexpected=$((unexpected + 1))
              echo "· ${base}（dmg 名不含本次版本，需人工核对）"
            else
              unexpected=$((unexpected + 1))
              echo "::warning::${base} 的文件名里没有本次版本 ${conf}，且不属于已知的免版本号形态"
            fi
          done < <(find artifacts -type f \( -name '*.dmg' -o -name '*-setup.exe' -o -name '*.msi' -o -name '*.AppImage' -o -name '*.AppImage.tar.gz' -o -name '*.deb' -o -name '*.app.tar.gz' \) | sort)
          echo "统计：安装包 ${total} 个，文件名含 ${conf} 的 ${named} 个，按设计不含版本的 macOS 更新包 ${nover} 个，待人工核对 ${unexpected} 个。"
          {
            echo "## 产物版本自检"
            echo "- 触发引用：\`${GITHUB_REF_NAME}\`（事件 ${GITHUB_EVENT_NAME}）"
            echo "- 源码版本（\`src-tauri/tauri.conf.json\`）：\`${conf}\`"
            echo "- 汇总到的安装包：${total} 个 — 文件名带本次版本的 ${named} 个 / macOS 更新包（按设计无版本名）${nover} 个 / 待人工核对 ${unexpected} 个"
            echo "- 更新清单：\`$(node -p "Object.keys(require('./latest.json').platforms).join(', ')")\`"
            echo "- 结论：**待人工核对项为 0 时才可 Publish**；一旦安装包名与源码版本不符，先确认标签是否打在含本次版本推进的提交上。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 读取版本号（Release 标签名）
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - name: 上传到 GitHub Release（仅推 tag 或勾选 create_release 时）
        if: github.event_name == 'push' || inputs.create_release == true
        uses: softprops/action-gh-release@v2
        with:
          # 与三个 build 作业同一个标签名——清单必须落到同一批资产旁边。
          # 不重发 release_name/body/generate_release_notes，避免覆盖前面作业已建好的正文。
          tag_name: v${{ steps.ver.outputs.version }}
          draft: true
          files: latest.json
