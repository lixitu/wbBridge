# ═══════════════════════════════════════════════════════════════════
# WB Bridge — 发布自动打包工作流
# ───────────────────────────────────────────────────────────────────
# 触发：推送 v* 标签（如 v1.0.1）或手动 workflow_dispatch
#   • 手动触发（workflow_dispatch）：默认【仅测试构建】——只上传 Actions
#     Artifact 不创建 Release，可下载安装包在本地测试；
#     勾选 create_release 后才创建 Draft Release（与推 tag 行为一致）
# 产物：
#   • Windows:  NSIS 安装包(.exe) + MSI 安装包(.msi)
#   • macOS:   .dmg + .app（ad-hoc 签名）
#   • Linux:   .AppImage + .deb
# 说明：
#   • 核心已用 Rust 重写并**静态编进 Tauri 壳**（`src-tauri/core/` 作为 path 依赖），
#     不再需要 Node 运行时、不再有 pkg sidecar 打包步骤，也不再有 `src-tauri/binaries/`；
#     因此构建 = cargo 编译壳（含核心）+ Vite 打包面板，Node 只用于前端构建。
#   • macOS 产物为 ad-hoc 签名（无 Developer ID 证书），首次打开需在
#     系统设置中放行。
#   • Windows 产物未签名，SmartScreen 会提示"更多信息 → 仍要运行"。
#   • 所有产物先上传为 Actions Artifact，再汇总到 Draft Release，
#     人工确认后点"Publish release"正式发布。
#   • test 作业里有一道「触发标签 ↔ src-tauri/tauri.conf.json 版本」闸门：标签名与源码版本
#     不一致时直接失败。v1.0.1 曾把标签打在不含版本推进的提交上，于是安静地产出了
#     WB Bridge_1.0.0_* 且功能落后 4 个提交的安装包；check-version.mjs 只校验同一提交内
#     各处落点互相一致，抓不到这类错，所以必须单独设闸。
#   • 发布顺序铁律：先 `npm run version:set -- <x.y.z>` 并提交，**再**在那一个提交上打标签。
# 自动更新（v1.0.2 起接线）：
#   • bundle.createUpdaterArtifacts=true → 每个平台额外产出更新包与 .sig：
#       macOS tauri 实测产出「WB Bridge.app.tar.gz(.sig)」——**既不带版本也不带架构**，
#            两个 mac runner 会往同一 Release 传同名资产、后者静默覆盖前者，
#            所以本工作流在上传前把它改名为「WB Bridge_<arch>.app.tar.gz(.sig)」
#            （minisign 签的是内容不是文件名，改名不影响验签）。
#       Windows *-setup.exe(.sig)（MSI 不参与更新）
#       Linux   官方文档写 *.AppImage(.sig)；bundler 是否额外打一层 *.AppImage.tar.gz
#               只能等首次 CI 跑出来核对，生成脚本对两种形态都接受（同时带签名时取 .tar.gz 并告警）。
#   • 签名私钥走 GitHub Secrets：TAURI_SIGNING_PRIVATE_KEY（**内联私钥全文**）
#     与 TAURI_SIGNING_PRIVATE_KEY_PASSWORD；公钥内嵌 src-tauri/tauri.conf.json 的
#     plugins.updater.pubkey（当前 key ID 126D4E208E0F17BA，2026-10-01 新生成的 wbBridge 专用钥）。
#     **私钥绝不入库、不进日志。**
#     ⚠ 实测（本机 1.0.1 / tauri-cli 2.12）：`tauri build` **只读 TAURI_SIGNING_PRIVATE_KEY**
#     （值可以是私钥全文，也可以是私钥文件路径）；TAURI_SIGNING_PRIVATE_KEY_PATH 只对
#     `tauri signer sign` 生效。未配置该 Secret 时 createUpdaterArtifacts 会让构建直接失败，
#     而不是静默产出一批没有 .sig 的更新包。
#   • latest.json 由末尾的 update-manifest 作业单点生成（scripts/gen-latest-json.mjs）。
#     tauri-action 自己也会有感生成一份（includeUpdaterJson），但那是 6 个并发作业各写一次，
#     两台 macOS runner 几乎同时收尾时清单会静默漏掉一个平台，故显式关掉。
#   • Draft 未 Publish 前 releases/latest/download/latest.json 返回 404 属预期：
#     更新通道只在人工点完「Publish release」之后生效。
#   • ⚠ 本工作流自「移除 Node 核心」改造后尚未在 CI 上实际跑通，描述以脚本内容为准。
# ═══════════════════════════════════════════════════════════════════

name: Release Build (Tauri)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      create_release:
        description: '构建后创建 Draft Release（不勾选则仅上传 Artifact 供测试）'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # ── 核心测试（Rust：187 单测 + 11 组 JS↔Rust 对拍快照 + 9 条红线）────
  test:
    name: 核心测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js 24
        # 与根 package.json 的 engines.node >= 24 对齐（此前是 22，低于本仓声明的下限）。
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 启用 cargo 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri/core

      - name: 运行核心测试
        # 对拍测试比较的是 tests/fixtures/*.json 里冻结的 JS 真相快照，无需 Node。
        run: cargo test --manifest-path src-tauri/core/Cargo.toml

      - name: 校验版本号一致性
        # package.json / tauri.conf.json / Cargo.toml / AGENTS.md 必须同一版本。
        run: node scripts/check-version.mjs

      - name: 运行面板偏好与更新清单单测
        # 两组都是 node --test、只用 node 内置模块（不引测试框架、不需要 npm ci）：
        #   • src/core/prefs.test.js —— 凭据字段进不了 localStorage、坏数据回落默认值；
        #   • scripts/gen-latest-json.test.mjs —— latest.json 唯一写者的缺平台/缺签名/
        #     mac 漏架构后缀/歧义产物四类失败路径（这些错误 otherwise 只有用户装上才暴露）。
        run: |
          node --test src/core/prefs.test.js
          node --test scripts/gen-latest-json.test.mjs

      - name: 校验触发标签与源码版本一致
        # 上一项只比对「同一提交内 5 处落点互相一致」，因此标签指向一份全体为旧版本的
        # 提交时它照样通过 —— v1.0.1 就是这样产出了 WB Bridge_1.0.0_aarch64.dmg，而且那个
        # 安装包不含最近 4 个提交。这里补上唯一能抓住该错误的闸门。
        # 版本还会决定 tauri-action 的 tagName: v__VERSION__，不一致就会同时开出两个 Release。
        # workflow_dispatch 时 GITHUB_REF_NAME 是分支名，不参与比较，故只在推标签时运行。
        if: github.event_name == 'push'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          conf="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          echo "触发标签 = ${GITHUB_REF_NAME}，src-tauri/tauri.conf.json 版本 = ${conf}"
          if [ "${tag}" != "${conf}" ]; then
            echo "::error::标签 ${GITHUB_REF_NAME} 与源码版本 ${conf} 不一致：产物会被命名为 ${conf}，且该标签提交很可能不含本次版本推进。请先提交版本推进，再在那一个提交上重新打标签。"
            exit 1
          fi
          echo "标签与源码版本一致，可继续构建。"

  # ── macOS：.app + .dmg（ad-hoc 签名）────────────────────────────
  build-macos:
    name: macOS (${{ matrix.arch }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: aarch64-apple-darwin
          - os: macos-15
            arch: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js 24
        # 与根 package.json 的 engines.node >= 24 对齐（此前是 22，低于本仓声明的下限）。
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}

      - name: 启用 cargo 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci

      - name: 构建 Tauri 应用
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # updater 私钥（内联全文）；未配置时 createUpdaterArtifacts 会让构建直接失败，
          # 而不是静默产出一批没有签名的产物。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target ${{ matrix.arch }}
          tagName: v__VERSION__
          releaseName: 'WB Bridge v__VERSION__'
          releaseBody: 'WB Bridge — 让 WorkBuddy 使用 OpenCode 免费模型。'
          releaseDraft: true
          prerelease: false
          # 清单交给末尾的 update-manifest 作业单点写，避免 6 个并发作业互相覆盖。
          includeUpdaterJson: false

      - name: 给 macOS 更新包补架构后缀
        # 实测：tauri 产出的 updater 包叫「WB Bridge.app.tar.gz」，既不带版本也不带架构，
        # 于是两个 mac runner 会往同一个 Release 传**同名**资产、后者静默覆盖前者，
        # latest.json 也无法靠文件名区分 darwin-aarch64 / darwin-x86_64。
        # 统一补成「WB Bridge_<arch>.app.tar.gz」；.sig 同步改名——minisign 签的是内容不是文件名，
        # 因此改名不影响 updater 验签。
        run: |
          set -euo pipefail
          arch="${{ matrix.arch }}"
          arch="${arch%%-*}"
          renamed=0
          for bundle_dir in "src-tauri/target/${arch}-apple-darwin/release/bundle/macos" src-tauri/target/release/bundle/macos; do
            [ -d "${bundle_dir}" ] || continue
            for pkg in "${bundle_dir}"/*.app.tar.gz; do
              [ -e "${pkg}" ] || continue
              case "$(basename "${pkg}")" in *"_${arch}.app.tar.gz") continue ;; esac
              target="${pkg%.app.tar.gz}_${arch}.app.tar.gz"
              mv "${pkg}" "${target}"
              if [ -f "${pkg}.sig" ]; then
                mv "${pkg}.sig" "${target}.sig"
              else
                echo "::warning::${pkg} 没有配对 .sig，该平台产物不会进入更新清单"
              fi
              echo "重命名：$(basename "${pkg}") → $(basename "${target}")"
              renamed=$((renamed + 1))
            done
          done
          echo "本次补架构后缀（arch=${arch}）的 updater 包：${renamed} 个。"

      - name: 打印产物名（上传前留痕，供人工核对资产名 = tag 版本）
        # find 用 BSD/GNU 都支持的写法（macOS runner 上没有 GNU find 的 -printf）。
        shell: bash
        run: |
          conf="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          echo "源码版本 = ${conf}，触发引用 = ${GITHUB_REF_NAME}"
          find src-tauri/target -path '*/release/bundle/*' -type f \
            \( -name '*.dmg' -o -name '*.app' -o -name '*.app.tar.gz' -o -name '*.sig' \) -print | sort

      - name: 上传产物到 Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-bundles
          if-no-files-found: warn
          path: |
            src-tauri/target/${{ matrix.arch }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.arch }}/release/bundle/**/*.app
            src-tauri/target/${{ matrix.arch }}/release/bundle/**/*.app.tar.gz
            src-tauri/target/${{ matrix.arch }}/release/bundle/**/*.sig
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.app
            src-tauri/target/release/bundle/**/*.app.tar.gz
            src-tauri/target/release/bundle/**/*.sig

      - name: 上传到 GitHub Release（仅推 tag 或勾选 create_release 时）
        if: github.event_name == 'push' || inputs.create_release == true
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          # 更新包与 .sig 必须进 Release：latest.json 里的 url 指的就是这些资产。
          files: |
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.app
            src-tauri/target/**/release/bundle/**/*.app.tar.gz
            src-tauri/target/**/release/bundle/**/*.sig

  # ── Windows：NSIS + MSI ──────────────────────────────────────────
  build-windows:
    name: Windows (${{ matrix.arch }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            arch: x86_64-pc-windows-msvc
          - os: windows-11-arm
            arch: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js 24
        # 与根 package.json 的 engines.node >= 24 对齐（此前是 22，低于本仓声明的下限）。
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}

      - name: 启用 cargo 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci

      - name: 构建 Tauri 应用
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # updater 私钥（内联全文）；未配置时 createUpdaterArtifacts 会让构建直接失败，
          # 而不是静默产出一批没有签名的产物。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target ${{ matrix.arch }}
          tagName: v__VERSION__
          releaseName: 'WB Bridge v__VERSION__'
          releaseBody: 'WB Bridge — 让 WorkBuddy 使用 OpenCode 免费模型。'
          releaseDraft: true
          prerelease: false
          # 清单交给末尾的 update-manifest 作业单点写，避免 6 个并发作业互相覆盖。
          includeUpdaterJson: false

      - name: 打印产物名（上传前留痕，供人工核对资产名 = tag 版本）
        shell: bash
        run: |
          conf="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          echo "源码版本 = ${conf}，触发引用 = ${GITHUB_REF_NAME}"
          find src-tauri/target -path '*/release/bundle/*' -type f \
            \( -name '*.exe' -o -name '*.msi' -o -name '*.sig' \) -print | sort

      - name: 上传产物到 Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}-bundles
          if-no-files-found: warn
          path: |
            src-tauri/target/**/release/bundle/**/*.exe
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.sig

      - name: 上传到 GitHub Release（仅推 tag 或勾选 create_release 时）
        if: github.event_name == 'push' || inputs.create_release == true
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          # NSIS 安装包 + .sig 是更新链路的资产；MSI 只给人工安装用，不参与 updater。
          files: |
            src-tauri/target/**/release/bundle/**/*.exe
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.sig

  # ── Linux：.AppImage + .deb ──────────────────────────────────────
  build-linux:
    name: Linux (${{ matrix.arch }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            arch: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js 24
        # 与根 package.json 的 engines.node >= 24 对齐（此前是 22，低于本仓声明的下限）。
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}

      - name: 启用 cargo 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: 安装前端依赖
        run: npm ci

      - name: 构建 Tauri 应用
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # updater 私钥（内联全文）；未配置时 createUpdaterArtifacts 会让构建直接失败，
          # 而不是静默产出一批没有签名的产物。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target ${{ matrix.arch }}
          tagName: v__VERSION__
          releaseName: 'WB Bridge v__VERSION__'
          releaseBody: 'WB Bridge — 让 WorkBuddy 使用 OpenCode 免费模型。'
          releaseDraft: true
          prerelease: false
          # 清单交给末尾的 update-manifest 作业单点写，避免 6 个并发作业互相覆盖。
          includeUpdaterJson: false

      - name: 打印产物名（上传前留痕，供人工核对资产名 = tag 版本）
        shell: bash
        run: |
          conf="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          echo "源码版本 = ${conf}，触发引用 = ${GITHUB_REF_NAME}"
          find src-tauri/target -path '*/release/bundle/*' -type f \
            \( -name '*.AppImage' -o -name '*.AppImage.tar.gz' -o -name '*.deb' -o -name '*.sig' \) -print | sort

      - name: 上传产物到 Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}-bundles
          if-no-files-found: warn
          path: |
            src-tauri/target/**/release/bundle/**/*.AppImage
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.AppImage.tar.gz
            src-tauri/target/**/release/bundle/**/*.sig

      - name: 上传到 GitHub Release（仅推 tag 或勾选 create_release 时）
        if: github.event_name == 'push' || inputs.create_release == true
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            src-tauri/target/**/release/bundle/**/*.AppImage
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.AppImage.tar.gz
            src-tauri/target/**/release/bundle/**/*.sig

  # ── 更新清单：六平台产物的唯一汇总写者 ────────────────────────────
  # 客户端 plugins.updater.endpoints 读 releases/latest/download/latest.json。
  # 放在最后一个作业 = 单一写者，不会出现「某平台静默缺席」；
  # gen-latest-json.mjs 默认要求六平台齐全，缺任何一个都退出 1 让本次发布失败。
  update-manifest:
    name: 生成更新清单 (latest.json)
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 下载六平台产物
        uses: actions/download-artifact@v4
        with:
          pattern: '*-bundles'
          path: artifacts

      - name: 生成 latest.json
        run: node scripts/gen-latest-json.mjs --dir artifacts --out latest.json

      - name: 产物版本自检（结论写进 run summary，供 Release 正文引用）
        # 汇总六个平台实际收到的安装包，逐个核对文件名里的版本号是否等于源码版本。
        # v1.0.1 事故的二次网：标签打在不含版本推进的提交上时，test 作业的标签闸门会先红；
        # 万一闸门被绕过（手动 dispatch、改了 conf 没改标签），这里仍能把错名产物摊在明面上。
        run: |
          set -uo pipefail
          conf="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          total=0; named=0; nover=0; unexpected=0
          while IFS= read -r f; do
            [ -n "${f}" ] || continue
            base="$(basename "${f}")"
            total=$((total + 1))
            if [[ "${base}" == *"${conf}"* ]]; then
              named=$((named + 1))
              echo "· ${base}"
            elif [[ "${base}" == *".app.tar.gz" ]]; then
              nover=$((nover + 1))
              echo "· ${base}（macOS 更新包名按设计不含版本）"
            elif [[ "${base}" == *".dmg" ]]; then
              unexpected=$((unexpected + 1))
              echo "· ${base}（dmg 名不含本次版本，需人工核对）"
            else
              unexpected=$((unexpected + 1))
              echo "::warning::${base} 的文件名里没有本次版本 ${conf}，且不属于已知的免版本号形态"
            fi
          done < <(find artifacts -type f \( -name '*.dmg' -o -name '*-setup.exe' -o -name '*.msi' -o -name '*.AppImage' -o -name '*.AppImage.tar.gz' -o -name '*.deb' -o -name '*.app.tar.gz' \) | sort)
          echo "统计：安装包 ${total} 个，文件名含 ${conf} 的 ${named} 个，按设计不含版本的 macOS 更新包 ${nover} 个，待人工核对 ${unexpected} 个。"
          {
            echo "## 产物版本自检"
            echo "- 触发引用：\`${GITHUB_REF_NAME}\`（事件 ${GITHUB_EVENT_NAME}）"
            echo "- 源码版本（\`src-tauri/tauri.conf.json\`）：\`${conf}\`"
            echo "- 汇总到的安装包：${total} 个 — 文件名带本次版本的 ${named} 个 / macOS 更新包（按设计无版本名）${nover} 个 / 待人工核对 ${unexpected} 个"
            echo "- 更新清单：\`$(node -p "Object.keys(require('./latest.json').platforms).join(', ')")\`"
            echo "- 结论：**待人工核对项为 0 时才可 Publish**；一旦安装包名与源码版本不符，先确认标签是否打在含本次版本推进的提交上。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传到 GitHub Release（仅推 tag 或勾选 create_release 时）
        if: github.event_name == 'push' || inputs.create_release == true
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: latest.json

