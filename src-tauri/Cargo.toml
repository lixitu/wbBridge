[package]
name = "wbbridge"
version = "1.1.15"
description = "WB Bridge — 让 WorkBuddy 使用 OpenCode 免费模型"
authors = ["WB Bridge"]
edition = "2021"
# 下限由锁定依赖图决定：tauri 2.12 / tray-icon / 各官方插件都声明 1.90（与核心 crate 保持一致）
rust-version = "1.90"

[lib]
name = "wbbridge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
# 自动更新（updater 插件 + 装完重启用的 process::relaunch）。官方 Tauri 插件，同一维护方。
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
# 核心代理以库形式嵌进壳进程（不再有 sidecar 子进程）：编排层见 src-tauri/core/src/orchestration.rs。
# 核心仍是独立 crate（path 依赖）：它的 278 个测试不需要编译 tauri/webkit 图，也能单独跑出 wbbridge-core 二进制。
wbbridge-core = { path = "core" }
# 核心需要独立的专用运行时（不能嵌进 Tauri 自己的异步上下文里 block_on）。
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# 磁盘占用：开发树的绝大多数是第三方依赖的 split-debuginfo（`*.rcgu.o`，本机实测占 deps 的
# 39%~89%）。依赖内部不需要断点，自己的代码保留完整调试信息。
[profile.dev.package."*"]
debug = false
# 核心是 path 依赖、不是本 workspace 成员，会被上面的 `*` 命中；显式保留，否则 `tauri:dev`
# 里调试编排/探测链路时只剩无变量的帧。它自己的 workspace 不受这条影响。
[profile.dev.package.wbbridge-core]
debug = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
