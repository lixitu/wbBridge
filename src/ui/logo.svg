<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="cable" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C7D2FE"/>
      <stop offset="1" stop-color="#E0E7FF"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect x="26" y="26" width="460" height="460" rx="94" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="4"/>
  <!-- W-shaped main cable between two tower tops -->
  <path d="M110 168 C 140 288, 165 300, 183 300 C 210 300, 232 240, 256 240 C 280 240, 302 300, 329 300 C 347 300, 372 288, 402 168"
        fill="none" stroke="url(#cable)" stroke-width="26" stroke-linecap="round"/>
  <!-- suspenders -->
  <g stroke="#E0E7FF" stroke-width="8" stroke-linecap="round" opacity="0.55">
    <line x1="147" y1="252" x2="147" y2="352"/>
    <line x1="183" y1="300" x2="183" y2="352"/>
    <line x1="220" y1="265" x2="220" y2="352"/>
    <line x1="292" y1="265" x2="292" y2="352"/>
    <line x1="329" y1="300" x2="329" y2="352"/>
    <line x1="365" y1="252" x2="365" y2="352"/>
  </g>
  <!-- towers -->
  <g stroke="#EEF2FF" stroke-width="24" stroke-linecap="round">
    <line x1="110" y1="150" x2="110" y2="352"/>
    <line x1="402" y1="150" x2="402" y2="352"/>
  </g>
  <!-- deck -->
  <line x1="64" y1="352" x2="448" y2="352" stroke="#EEF2FF" stroke-width="24" stroke-linecap="round"/>
  <!-- connection node at the W mid-peak -->
  <circle cx="256" cy="240" r="15" fill="#EEF2FF"/>
</svg>
